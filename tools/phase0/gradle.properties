# Phase 0 harness. See tools/phase0/README.md.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2

android.useAndroidX=true
android.nonTransitiveRClass=true

# The Gradle daemon must run on a Java Development Kit (JDK) 21. Set JAVA_HOME before
# invoking the wrapper; a machine-specific path is deliberately NOT hard-coded here.
# Gradle 8.14 does not support JDK 25, which is what recent Android Studio bundles.
