# The Gradle daemon must run on a Java Development Kit (JDK) 21. Set JAVA_HOME before
# invoking the wrapper; a machine-specific path is deliberately NOT hard-coded here.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2

android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 2.3.20 crashes in its incremental Kotlin/WebAssembly klib path on any rebuild
# after an edit -- ArrayIndexOutOfBoundsException in WasmIrFileMetadata.fromByteArray. Clean
# builds always succeed. Disabled globally rather than worked around per module.
kotlin.incremental.js.klib=false
