# Project Dogwood -- the tier that a hosted runner can honestly gate.
#
# `plans/conformance.md` splits every claim into two tiers. **Tier S** is proved by tests over code
# every client compiles, so it needs nothing but a Java Development Kit and gates here, on every
# push. **Tier C** needs the platform itself -- a booted iOS simulator with VoiceOver enabled, an
# attached Android device, a browser with a graphics stack, and the guest being served -- none of
# which a hosted runner has. Pretending otherwise would produce a green tick that means less than
# it appears to, which is the failure this whole plan exists to avoid.
#
# So tier C gates locally and before a release, through `tools/conformance/run-all.sh`, and this
# file says so rather than leaving the gap to be discovered.
name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared-tier:
    name: Tier S — shared-code claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and run every shared test
        working-directory: engine
        # The Android lint task is excluded for the same reason it is excluded locally: it is a
        # style pass over the sample, not a claim about the engine.
        run: ./gradlew build -x :samples:slice-android:lintDebug --console=plain

      - name: Grade the shared-code claims
        # `from_tests.py` maps test classes onto conformance claims and reads the results the build
        # just wrote. A claim whose evidence did not run is a failure here, not an absence: "no
        # result" and "green" must never look the same.
        run: python3 tools/conformance/from_tests.py

      - name: Grade the page-weight budget
        # The one performance budget a hosted runner can measure honestly, because bytes are a
        # property of the build rather than of the machine. The timing budgets need real hardware
        # and are graded by `run-all.sh`.
        run: python3 tools/conformance/from_web_weight.py

      - name: Publish the claim results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-shared
          path: tools/conformance/build/
          if-no-files-found: ignore
