# Project Dogwood -- the checks a hosted runner can honestly make.
#
# `plans/conformance.md` splits every promise this architecture makes into two tiers.
#
#   Tier S  proved by tests over code every client compiles. Needs a Java Development Kit and a
#           browser, both of which a runner has. **Gated here, on every pull request.**
#   Tier C  needs the platform itself -- a booted iOS simulator with VoiceOver enabled, an attached
#           Android device, and the guest served from a development server. A runner has none of
#           them. Gated by `tools/conformance/run-all.sh`, locally and before a release.
#
# Wiring tier C in anyway would produce a green tick that means less than it appears to, which is
# the failure the whole conformance plan exists to avoid. `docs/checks.md` is the full inventory of
# what runs where, so the boundary is written down rather than inferred from this file.
#
# **With one exception, and it is an exception on the evidence rather than on the rule.** The web
# skew drill is a tier-C run -- a real client meeting a real payload built against a newer
# dictionary -- that needs no device at all: the host is a WebAssembly module in a directory and
# the guest is a script beside it. A runner has Chrome, so it can produce the condition honestly.
# It is a second job rather than a step in the first, because the two would otherwise compete for
# one two-processor runner, and the tier-S build already came close to being killed for memory.
name: conformance

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you about code nobody is merging. Cancel it and keep the runner for the
# push that replaced it.
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tier-s:
    name: Tier S — shared-code claims and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        # `pipefail`, and the reason is a bug this workflow shipped with. A step written as
        # `python3 grade.py | tee out.conf` reports `tee`'s exit code, not the grader's -- so the
        # first green run of this workflow was green while two claims were red. GitHub's default
        # shell is `bash -e`, which does not include `pipefail`; every pipeline here needs it.
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          # Gradle's own caches. The first run of this workflow took fourteen minutes, almost all
          # of it re-downloading and re-compiling what the previous run already had.
          cache: gradle

      - name: Cache the Kotlin/Native and Kotlin/JS toolchains
        # Neither is covered by the Gradle cache above. Between them they are most of what a cold
        # run spends its time fetching: the Kotlin/Native compiler and its platform libraries, and
        # the Node and Yarn installs the JavaScript and WebAssembly targets need.
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/yarn
            ~/.gradle/nodejs
          key: ${{ runner.os }}-kotlin-toolchains-${{ hashFiles('engine/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-kotlin-toolchains-

      - name: Size the build for this runner
        # A private free-tier runner is two processors and seven gigabytes. The repository's own
        # `gradle.properties` asks for a four-gigabyte Gradle daemon and parallel execution, which
        # is right for a development machine and is what killed the first two runs here -- the
        # second died with exit code 143, a SIGTERM from the runner, nineteen minutes in during the
        # WebAssembly compile. Gradle's daemon, the Kotlin compile daemon and Node were competing
        # for the same seven gigabytes.
        #
        # Written to `GRADLE_USER_HOME` rather than committed, because it takes precedence over the
        # project's file and leaves the development machine's settings alone.
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2500m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=1
          kotlin.daemon.jvmargs=-Xmx1600m
          PROPS

      - name: Check the shared render tests can report at all
        # Before the build, because it costs a second and it answers a question the build cannot:
        # `runComposeUiTest` returns a promise on Kotlin/WebAssembly that the test framework awaits
        # only if the test function returns it, so a render test with a block body composes nothing
        # there and is green either way. Every shared render test was written that way once, and
        # they were green on the web for weeks while composing nothing.
        run: python3 tools/render-shape/check.py

      - name: Build, and run every shared test
        working-directory: engine
        # Android lint is excluded for the reason it is excluded locally: it is a style pass over a
        # sample, not a claim about the engine.
        run: ./gradlew build -x :samples:slice-android:lintDebug --console=plain

      - name: Grade the shared-code claims
        # `from_tests.py` maps test classes onto conformance claims and reads the results the build
        # just wrote. A claim whose evidence did not run fails here rather than reading as absent:
        # deleting a test must not silently drop a claim to green.
        #
        # `--have` names the toolchains this runner can actually execute. A Linux runner has no
        # Kotlin/Native, so the two iOS-target rows are reported as not gradable here rather than
        # as failures -- they are graded on a Mac by `run-all.sh`. Without this the workflow
        # reported two red claims against a product that was fine.
        run: python3 tools/conformance/from_tests.py --have jvm,js,wasm | tee /tmp/tier-s.conf

      - name: Install brotli
        # `web-weight/measure.sh` shells out to it, and an Ubuntu runner does not have it. Without
        # this the budget step reported SKIP -- "the harness produced no total" -- and the workflow
        # went green having graded nothing. An ungraded budget must be a failure here, not a shrug,
        # which is why it is installed rather than tolerated.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq brotli

      - name: Grade the page-weight budget
        # The one performance budget a runner can measure honestly, because bytes are a property of
        # the build rather than of the machine. The timing budgets need real hardware and are
        # graded by `run-all.sh`.
        run: python3 tools/conformance/from_web_weight.py | tee -a /tmp/tier-s.conf

      - name: Put the claim table in the run summary
        if: always()
        # So a reviewer sees which claims were graded without opening a log or downloading an
        # artifact. A result nobody reads is the failure this project has met six times.
        run: |
          {
            echo '## Conformance — tier S'
            echo
            if [ -s /tmp/tier-s.conf ]; then
              echo '```'
              grep -E '^CONF ' /tmp/tier-s.conf || true
              echo '```'
            else
              echo 'The build failed before any claim was graded.'
            fi
            echo
            echo '> Tier C — accessibility, network policy, skew containment and the timing'
            echo '> budgets — needs a device, a simulator and a served guest, so it is graded by'
            echo '> `tools/conformance/run-all.sh` rather than here. See `docs/checks.md`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the claim results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-tier-s
          path: /tmp/tier-s.conf
          if-no-files-found: ignore

  web-skew:
    name: Skew containment — the web client
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache the Kotlin/JS toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/yarn
            ~/.gradle/nodejs
          key: ${{ runner.os }}-web-skew-${{ hashFiles('engine/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-web-skew-

      - name: Size the build for this runner
        # The same reasoning as the tier-S job: two processors and seven gigabytes, and a
        # WebAssembly compile that will take the runner down if Gradle, the Kotlin daemon and Node
        # all ask for a development machine's share.
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2500m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=1
          kotlin.daemon.jvmargs=-Xmx1600m
          PROPS

      - name: Find Chrome
        # Asserted rather than assumed. If the runner image stops shipping Chrome, this job must
        # fail loudly here instead of reporting a drill that could not run as one that passed.
        run: |
          for candidate in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$candidate" >/dev/null; then
              echo "CHROME=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no Chrome on this runner; the drill cannot run" >&2
          exit 1

      - name: Run the drill
        # Two builds by construction: the whole distribution at dictionary version N, then **only**
        # the guest script at N+1, copied over the one in that distribution. The script hashes
        # `app.js` before and after and fails if it changed, because a host rebuilt alongside the
        # guest is a drill that quietly tests nothing. It restores the surface on every exit path.
        run: tools/skew-drill/run-web.sh

      - name: Put the claim table in the run summary
        if: always()
        run: |
          {
            echo '## Skew containment — web'
            echo
            if [ -s tools/skew-drill/build/skew-web.conf ]; then
              echo '```'
              cat tools/skew-drill/build/skew-web.conf
              echo '```'
            else
              echo 'The drill did not reach the point of grading a claim.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the claim results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-web-skew
          path: tools/skew-drill/build/skew-web.conf
          if-no-files-found: ignore
