# Compose Multiplatform's Android artifacts are AndroidX, so the `:android` compile probe needs
# this. An adopter with an existing Android application already has it set.
android.useAndroidX=true

# The Kotlin/Native compiler builds a cache of every dependency klib the first time it links a
# framework, and on the default heap that ran out of memory partway through `dogwood-host`'s iOS
# klib ("Java heap space" from inside `ZipFileSystem`, reported as "Failed to build cache"). The
# engine's own build carries the same two lines; an adopter's iOS project will need them too.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.native.jvmArgs=-Xmx3g
